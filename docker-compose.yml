# =====================================================================
# Déploiement Docker « nu » sur un VPS, avec nginx en frontal.
#
# Sur Dokploy, n'utilise PAS ce fichier : la plateforme construit l'image
# depuis le Dockerfile et place Traefik devant. Le service nginx ferait
# doublon.
#
# Aucune variable n'est nécessaire au build : tout se règle à l'exécution.
#   cp .env.deploiement.example .env   puis renseigne les valeurs
#   docker compose up -d --build
# =====================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Le serveur les lit au démarrage et injecte les deux publiques dans
      # la page. La clé de service, elle, ne quitte jamais le serveur.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider",
             "http://127.0.0.1:3000/api/sante"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/crm-altitude.conf:ro
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_healthy
