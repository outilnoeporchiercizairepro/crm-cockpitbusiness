# =====================================================================
# Reverse proxy devant CRM Altitude.
#
# À n'utiliser QUE si tu déploies avec Docker « nu » sur un VPS.
# Sur Dokploy, Traefik joue déjà ce rôle et gère le certificat TLS :
# ce fichier serait alors redondant et créerait un second point d'entrée.
#
# Emplacement attendu : /etc/nginx/conf.d/crm-altitude.conf
# =====================================================================

# $connection_upgrade ne vaut « upgrade » que si le client le demande.
# `map` appartient au contexte http : ce fichier étant destiné à
# /etc/nginx/conf.d/, il y est bien inclus. Sans cette directive, nginx
# refuse de démarrer sur une variable inconnue.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream crm_altitude {
    # « app » est le nom du service dans docker-compose.yml.
    server app:3000;
    keepalive 32;
}

# Redirection HTTP → HTTPS. À activer une fois le certificat en place.
# server {
#     listen 80;
#     server_name crm.altitude.fr;
#     location /.well-known/acme-challenge/ { root /var/www/certbot; }
#     location / { return 301 https://$host$request_uri; }
# }

server {
    listen 80;
    server_name _;

    # listen 443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/crm.altitude.fr/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.altitude.fr/privkey.pem;

    # L'import CSV envoie son contenu au serveur : 1 Mo par défaut serait
    # vite atteint sur un export complet.
    client_max_body_size 25m;

    # Ne pas annoncer la version de nginx.
    server_tokens off;

    # En-têtes de sécurité. Pas de CSP ici : l'application charge ses
    # propres scripts et se connecte à Supabase en WebSocket, une politique
    # trop stricte la casserait silencieusement.
    add_header X-Frame-Options            SAMEORIGIN     always;
    add_header X-Content-Type-Options     nosniff        always;
    add_header Referrer-Policy            same-origin    always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---- Fichiers générés par le build ----------------------------------
    # Leur nom contient une empreinte : ils ne changent jamais à contenu
    # identique, on peut donc les mettre en cache sans limite.
    location /_next/static/ {
        proxy_pass http://crm_altitude;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location /_next/image {
        proxy_pass http://crm_altitude;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 7d;
    }

    # ---- Sonde de santé --------------------------------------------------
    location = /api/sante {
        proxy_pass http://crm_altitude;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # ---- Application -----------------------------------------------------
    location / {
        proxy_pass http://crm_altitude;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Nécessaire à la montée en WebSocket. Le temps réel de Supabase va
        # du navigateur à Supabase sans passer ici, mais d'autres flux Next
        # en dépendent.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Les pages sont rendues à la demande : ne rien mettre en cache ici,
        # sous peine de servir les données d'un utilisateur à un autre.
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
